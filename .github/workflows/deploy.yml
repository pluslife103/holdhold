name: Deploy Big Holder Web

on:
  push:
    branches: [main]
    paths:
      - 'big_holder_web.py'
      - 'requirements.txt'
      - 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy from GitHub source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service etf-aag87uqu --from-source --yes
