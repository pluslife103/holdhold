name: US Stocks Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'  # 22:00 UTC = 台灣時間隔天 06:00，美股收盤後 2 小時

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install "yfinance>=1.3.0" requests pandas

      - name: Fetch stock data → Turso
        working-directory: us-stocks-screener
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python backfill.py
