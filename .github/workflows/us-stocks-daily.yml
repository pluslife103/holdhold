name: US Stocks Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'  # 22:00 UTC = 台灣時間隔天 06:00，美股收盤後 2 小時

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install yfinance requests pandas

      - name: Fetch stock data → history.db
        working-directory: us-stocks-screener
        run: python backfill.py

      - name: Commit & push updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us-stocks-screener/data/history.db
          git commit -m "data: update stocks $(date +%Y-%m-%d)" || echo "no changes"
          git push
