<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>登入</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05070f;
      --surface: #0e1425;
      --surface2: #151d35;
      --border: #1e2d50;
      --text: #e2e8f0;
      --muted: #7a8ba8;
      --accent: #3b82f6;
      --red: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px 24px;
    }
    .logo {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .muted { color: var(--muted); font-size: 0.88rem; line-height: 1.6; margin: 8px 0 20px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
    input[type="password"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
    }
    input[type="password"]:focus { border-color: var(--accent); }
    button {
      width: 100%;
      margin-top: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .err {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.86rem;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login" autocomplete="current-password">
    <div class="logo">📊</div>
    <h1>登入</h1>
    <p class="muted">這個網站需要密碼才能查看。</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="password">密碼</label>
    <input id="password" name="password" type="password" required autofocus maxlength="256" autocomplete="current-password" />
    <input type="hidden" name="next" value="{{ next }}" />
    <button type="submit">進入</button>
  </form>
</body>
</html>
