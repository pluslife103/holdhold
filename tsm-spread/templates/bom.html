<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>經濟拆解分析儀 | TSM 追蹤器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05070f; --surface: #0e1425; --surface2: #151d35; --border: #1e2d50;
      --text: #e2e8f0; --muted: #7a8ba8; --accent: #3b82f6;
      --indigo: #6366f1; --green: #22c55e; --red: #ef4444; --gold: #f59e0b;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }

    /* ── HEADER ── */
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; }
    .subtitle { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 8px; padding: 7px 16px; font-size: .82rem; cursor: pointer; font-weight: 600; transition: opacity .15s, background .15s; text-decoration: none; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--indigo); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); opacity: 1; background: var(--surface2); }
    .btn-danger { background: rgba(239,68,68,.12); color: var(--red); border: 1px solid rgba(239,68,68,.25); }
    .btn-sm { padding: 5px 12px; font-size: .78rem; }

    /* ── BREADCRUMB ── */
    .breadcrumb { padding: 11px 28px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; font-size: .82rem; flex-wrap: wrap; }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--text); }
    .breadcrumb .sep { color: #2a3f6e; }
    .breadcrumb .cur { color: var(--text); font-weight: 500; }

    /* ── LAYOUT ── */
    main { max-width: 1280px; margin: 0 auto; padding: 28px; }

    /* ── HOME GRID ── */
    .bom-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .bom-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color .2s; }
    .bom-card:hover { border-color: #2a3f6e; }
    .bom-card-top { height: 4px; }
    .bom-card-body { padding: 18px; }
    .bom-card-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .bom-card-desc { font-size: .8rem; color: var(--muted); margin-bottom: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bom-card-meta { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); margin-bottom: 11px; }
    .bom-mini-bar { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; display: flex; gap: 1px; margin-bottom: 14px; }
    .bom-card-actions { display: flex; gap: 8px; }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 80px 20px; }
    .empty-icon { font-size: 3.5rem; opacity: .2; margin-bottom: 16px; }
    .empty-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
    .empty-desc { font-size: .88rem; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }

    /* ── DETAIL ── */
    .detail-hdr { margin-bottom: 22px; }
    .detail-name-row { display: flex; align-items: flex-start; gap: 12px; }
    .detail-bar { width: 4px; height: 38px; border-radius: 3px; flex-shrink: 0; margin-top: 2px; }
    .detail-title { font-size: 1.4rem; font-weight: 700; }
    .detail-desc-txt { font-size: .85rem; color: var(--muted); margin-top: 3px; }
    .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; margin-left: 16px; }

    /* ── STATS ROW ── */
    .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; }
    .stat-lbl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
    .stat-val { font-size: 1.4rem; font-weight: 700; }
    .stat-note { font-size: .72rem; margin-top: 2px; }
    .stat-warn { border-color: rgba(245,158,11,.35); }
    .stat-warn .stat-val, .stat-warn .stat-note { color: var(--gold); }
    .stat-err { border-color: rgba(239,68,68,.35); }
    .stat-err .stat-val, .stat-err .stat-note { color: var(--red); }

    /* ── DETAIL GRID ── */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 860px) { .detail-grid { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .card-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
    .card-hint { font-size: .72rem; color: #2a3f6e; margin-bottom: 14px; }

    /* ── CHILDREN TABLE ── */
    .ch-table { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .ch-table-hdr { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .ch-table-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
    .ch-list { max-height: 340px; overflow-y: auto; }
    .ch-row { display: flex; align-items: center; gap: 10px; padding: 11px 20px; border-bottom: 1px solid rgba(30,45,80,.4); cursor: pointer; transition: background .15s; }
    .ch-row:last-child { border-bottom: none; }
    .ch-row:hover { background: var(--surface2); }
    .ch-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .ch-info { flex: 1; min-width: 0; }
    .ch-name { font-size: .88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-subdesc { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .ch-bar { height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-top: 4px; max-width: 100px; }
    .ch-bar-fill { height: 100%; border-radius: 2px; }
    .ch-val { text-align: right; flex-shrink: 0; font-weight: 700; font-size: .88rem; }
    .ch-pct { font-size: .72rem; color: var(--muted); }
    .ch-acts { display: flex; gap: 4px; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
    .ch-row:hover .ch-acts { opacity: 1; }
    .ch-btn { width: 26px; height: 26px; border: none; border-radius: 6px; background: var(--surface2); color: var(--muted); cursor: pointer; font-size: .78rem; display: flex; align-items: center; justify-content: center; transition: all .15s; }
    .ch-btn:hover { background: var(--indigo); color: #fff; }
    .ch-btn.del:hover { background: rgba(239,68,68,.18); color: var(--red); }

    /* ── MODAL ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 24px 64px rgba(0,0,0,.7); max-height: 90vh; overflow-y: auto; }
    .modal-wide { max-width: 680px; }
    .modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
    .modal-title { font-size: 1rem; font-weight: 600; }
    .modal-x { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 4px 8px; border-radius: 6px; transition: all .15s; }
    .modal-x:hover { color: var(--text); background: var(--surface2); }
    .modal-body { padding: 20px 22px; }

    /* ── FORM ── */
    .fg { margin-bottom: 15px; }
    .fl { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
    .fl .req { color: var(--accent); }
    .fi, .fs, .ft { width: 100%; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: .88rem; outline: none; transition: border-color .15s; font-family: inherit; }
    .fi:focus, .fs:focus, .ft:focus { border-color: var(--indigo); }
    .ft { resize: vertical; min-height: 60px; }
    .frow { display: flex; gap: 12px; }
    .frow > .fg { flex: 1; margin-bottom: 0; }
    .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .cswatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .15s; }
    .cswatch.active { border-color: #fff; transform: scale(1.15); }
    .f-actions { display: flex; gap: 10px; margin-top: 18px; }
    .f-actions .btn { flex: 1; padding: 10px; }

    /* ── JSON MODAL ── */
    .json-tabs { display: flex; border-bottom: 1px solid var(--border); margin: 0 -22px 16px; padding: 0 22px; }
    .jtab { background: none; border: none; color: var(--muted); padding: 10px 16px; font-size: .88rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; }
    .jtab.active { color: var(--indigo); border-bottom-color: var(--indigo); }
    .json-ta { width: 100%; background: #020409; color: #4ade80; font-family: "Cascadia Code","Fira Code",Consolas,monospace; font-size: .73rem; border: 1px solid var(--border); border-radius: 10px; padding: 12px; height: 220px; resize: none; outline: none; }
    .json-hint { background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.2); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: .8rem; color: #a5b4fc; line-height: 1.55; }
    .json-hint strong { color: #818cf8; }
    .err-msg { color: var(--red); font-size: .8rem; margin-top: 6px; }

    /* ── SMART IMPORT ── */
    .step-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fcell { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .fcell.span2 { grid-column: 1/-1; }
    .fcell-lbl { font-size: .75rem; color: var(--muted); margin-bottom: 8px; }
    .fcell-lbl .req { color: var(--accent); margin-right: 3px; }
    .fprev { font-size: .72rem; color: #2a3f6e; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fprev .arr { color: #4f6ab0; }
    .smart-preview { background: #020409; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .sp-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid rgba(30,45,80,.5); }
    .sp-row:last-child { border-bottom: none; }
    .sp-more { padding: 7px 14px; text-align: center; font-size: .72rem; color: #2a3f6e; }

    /* ── MISC ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: #2a3f6e; border-radius: 3px; }
    .text-warn { color: var(--gold); }
    .text-muted { color: var(--muted); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <div>
      <h1>經濟拆解分析儀</h1>
      <div class="subtitle">BOM 成本結構 · 向下鑽取 · 圖表報表</div>
    </div>
  </div>
  <div class="header-right">
    <a href="/" class="btn btn-ghost btn-sm">← TSM 追蹤器</a>
    <button class="btn btn-ghost btn-sm" id="importBtn">匯入 JSON</button>
    <button class="btn btn-primary btn-sm" id="addBtn">+ 新增 BOM</button>
  </div>
</header>

<div id="breadcrumb" class="breadcrumb" style="display:none"></div>
<main id="app"></main>

<!-- Modal -->
<div id="overlay" class="modal-overlay" onclick="onOverlayClick(event)">
  <div id="modal" class="modal-box"></div>
</div>

<script>
/* ════ CONSTANTS ════════════════════════════════════════ */
const STORE_KEY = 'bom-v1'
const PALETTE = ['#6366f1','#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#84cc16','#a855f7']

const DEFAULT = { version:1, roots:[{
  id:'ai-server-001', name:'AI 伺服器 BOM', value:100, unit:'%',
  description:'AI 訓練/推理伺服器完整物料成本拆解（範例）', color:'#6366f1',
  children:[
    {id:'c001',name:'晶片 (GPU/CPU/ASIC)',value:70,unit:'%',description:'NVIDIA H100/H200 等高階 GPU 晶片',color:'#3b82f6',children:[]},
    {id:'c002',name:'記憶體 HBM/DRAM',value:10,unit:'%',description:'HBM3e/DDR5 大容量記憶體',color:'#8b5cf6',children:[]},
    {id:'c003',name:'高階散熱水冷板',value:5,unit:'%',description:'液冷散熱系統',color:'#06b6d4',children:[]},
    {id:'c004',name:'電源供應器',value:5,unit:'%',description:'高效率 PSU',color:'#f59e0b',children:[]},
    {id:'c005',name:'網路/InfiniBand',value:5,unit:'%',description:'高速互聯網路卡',color:'#10b981',children:[]},
    {id:'c006',name:'儲存 NVMe SSD',value:3,unit:'%',description:'高速儲存設備',color:'#ef4444',children:[]},
    {id:'c007',name:'其他 (機箱/主板)',value:2,unit:'%',description:'機箱、主機板、線材等',color:'#6b7280',children:[]},
  ]
}]}

/* ════ STORAGE ══════════════════════════════════════════ */
let S
function load() { try { const r=localStorage.getItem(STORE_KEY); S=r?JSON.parse(r):JSON.parse(JSON.stringify(DEFAULT)) } catch{ S=JSON.parse(JSON.stringify(DEFAULT)) } }
function save() { localStorage.setItem(STORE_KEY,JSON.stringify(S)) }

/* ════ UTILS ════════════════════════════════════════════ */
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36)
const col = i => PALETTE[i%PALETTE.length]
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
const sum = c => c.reduce((a,b)=>a+b.value,0)
function parseNum(v) {
  if(typeof v==='number') return v
  const n=(String(v).match(/[\d]+(?:\.\d+)?/g)??[]).map(Number)
  return n.length?Math.round(n.reduce((a,b)=>a+b,0)/n.length*100)/100:0
}

/* ════ TREE OPS ═════════════════════════════════════════ */
function findN(ns,id) { for(const n of ns){ if(n.id===id)return n; const f=findN(n.children,id); if(f)return f } return null }
function findPath(ns,id,acc=[]) { for(const n of ns){ const p=[...acc,n]; if(n.id===id)return p; const f=findPath(n.children,id,p); if(f.length)return f } return [] }
function updateN(ns,u) { return ns.map(n=>n.id===u.id?u:{...n,children:updateN(n.children,u)}) }
function delN(ns,id) { return ns.filter(n=>n.id!==id).map(n=>({...n,children:delN(n.children,id)})) }
function addChild(ns,pid,child) { return ns.map(n=>n.id===pid?{...n,children:[...n.children,child]}:{...n,children:addChild(n.children,pid,child)}) }

/* ════ CHARTS ═══════════════════════════════════════════ */
const CH={}
const kd = k => { if(CH[k]){CH[k].destroy();delete CH[k]} }

function drawPie(node) {
  kd('pie'); const cv=document.getElementById('cv-pie'); if(!cv||!node.children.length)return
  const total=sum(node.children), rem=node.unit==='%'&&total<99.9
  const labels=[...node.children.map(c=>c.name),...(rem?['未分配']:[]) ]
  const data  =[...node.children.map(c=>c.value),...(rem?[+(100-total).toFixed(2)]:[]) ]
  const bgs   =[...node.children.map(c=>c.color||'#6b7280'),...(rem?['#0e1425']:[]) ]
  CH.pie=new Chart(cv,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:bgs,borderColor:'transparent',hoverOffset:6}]},
    options:{onClick:(_,els)=>{if(els.length&&els[0].index<node.children.length)go('#bom/'+node.children[els[0].index].id)},
      plugins:{legend:{position:'bottom',labels:{color:'#7a8ba8',font:{size:11},boxWidth:12,padding:10}},
        tooltip:{callbacks:{label:c=>` ${c.parsed} ${node.unit}  (${c.label})`},backgroundColor:'#0e1425',titleColor:'#e2e8f0',bodyColor:'#a5b4fc',borderColor:'#1e2d50',borderWidth:1}},
      animation:{duration:400}}})
}

function drawBar(node) {
  kd('bar'); const cv=document.getElementById('cv-bar'); if(!cv||!node.children.length)return
  const sh=s=>{s=String(s??'');return s.length>9?s.slice(0,9)+'…':s}
  CH.bar=new Chart(cv,{type:'bar',
    data:{labels:node.children.map(c=>sh(c.name)),datasets:[{data:node.children.map(c=>c.value),backgroundColor:node.children.map(c=>c.color||'#6b7280'),borderRadius:5,borderSkipped:false}]},
    options:{onClick:(_,els)=>{if(els.length)go('#bom/'+node.children[els[0].index].id)},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y} ${node.unit}  (${node.children[c.dataIndex].name})`},backgroundColor:'#0e1425',titleColor:'#e2e8f0',bodyColor:'#a5b4fc',borderColor:'#1e2d50',borderWidth:1}},
      scales:{x:{ticks:{color:'#7a8ba8',font:{size:11},maxRotation:35,minRotation:15},grid:{color:'rgba(30,45,80,.4)'}},
              y:{ticks:{color:'#7a8ba8',font:{size:11}},grid:{color:'rgba(30,45,80,.4)'}}},
      animation:{duration:400}}})
}

/* ════ ROUTER ═══════════════════════════════════════════ */
function go(hash) { location.hash=hash; render() }
function curId() { const h=location.hash.replace('#',''); return h.startsWith('bom/')?h.slice(4):null }

function render() {
  kd('pie'); kd('bar')
  const id=curId()
  const addBtn=document.getElementById('addBtn')
  const impBtn=document.getElementById('importBtn')
  if(!id) {
    document.getElementById('breadcrumb').style.display='none'
    addBtn.style.display=''; impBtn.style.display=''
    addBtn.onclick=()=>showEditor({title:'新增 BOM',onSave:d=>{ S.roots.push({...d,id:uid(),color:d.color||col(S.roots.length),children:[]}); save(); render() }})
    impBtn.onclick=()=>showJson({mode:'import',onImport:importRoots})
    renderHome()
  } else {
    addBtn.style.display='none'; impBtn.style.display='none'
    renderDetail(id)
  }
}

/* ════ HOME ═════════════════════════════════════════════ */
function renderHome() {
  const app=document.getElementById('app')
  if(!S.roots.length) { app.innerHTML=`<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">還沒有任何 BOM</div><div class="empty-desc">建立 BOM 後可輸入成本組成<br>並向下無限拆解子層</div></div>`; return }
  app.innerHTML=`<div class="bom-grid">${S.roots.map(r=>{
    const tot=sum(r.children), isP=r.unit==='%'
    const warn=isP&&r.children.length&&Math.abs(tot-100)>0.1
    const mini=r.children.length?`<div class="bom-mini-bar">${r.children.map(c=>`<div style="flex:${c.value/((isP?100:tot)||1)*100};background:${c.color||'#6b7280'}"></div>`).join('')}</div>`:''
    return `<div class="bom-card"><div class="bom-card-top" style="background:${r.color||'#6366f1'}"></div>
      <div class="bom-card-body">
        <div class="bom-card-title">${esc(r.name)}</div>
        ${r.description?`<div class="bom-card-desc">${esc(r.description)}</div>`:''}
        <div class="bom-card-meta"><span>${r.children.length} 個組成項目</span>${r.children.length?`<span class="${warn?'text-warn':''}">${warn?'⚠ ':''}${tot.toFixed(1)} ${esc(r.unit)}</span>`:''}</div>
        ${mini}
        <div class="bom-card-actions">
          <button class="btn btn-primary btn-sm" style="flex:1" onclick="go('#bom/${r.id}')">查看分析 →</button>
          <button class="btn btn-danger btn-sm" onclick="delRoot('${r.id}')">✕</button>
        </div>
      </div></div>`
  }).join('')}</div>`
}

function importRoots(items) {
  const arr=Array.isArray(items)?items:[items]
  arr.forEach((it,i)=>S.roots.push({id:uid(),name:it.name||`BOM ${i+1}`,value:it.value??100,unit:it.unit||'%',description:it.description||undefined,color:it.color||col(S.roots.length),children:it.children||[]}))
  save(); render()
}

function delRoot(id) {
  if(!confirm('確定要刪除此 BOM 及所有子項目？'))return
  S.roots=S.roots.filter(r=>r.id!==id); save(); render()
}

/* ════ DETAIL ═══════════════════════════════════════════ */
function renderDetail(id) {
  const node=findN(S.roots,id); if(!node){go('#');return}
  const path=findPath(S.roots,id)

  // breadcrumb
  const bc=document.getElementById('breadcrumb')
  bc.style.display='flex'
  bc.innerHTML=`<a href="#" onclick="go('#');return false">首頁</a>${path.map((p,i)=>`<span class="sep">/</span>${i===path.length-1?`<span class="cur">${esc(p.name)}</span>`:`<a href="#bom/${p.id}" onclick="go('#bom/${p.id}');return false">${esc(p.name)}</a>`}`).join('')}`

  const tot=sum(node.children), isP=node.unit==='%'
  const over=isP&&tot>100.05, under=isP&&tot<99.95&&node.children.length>0
  const fmt=v=>v%1===0?v:v.toFixed(2)

  let content
  if(!node.children.length) {
    content=`<div class="empty"><div class="empty-icon">📦</div><div class="empty-title">此節點尚未拆解</div><div class="empty-desc">新增子項目來進一步拆解<br>可無限向下鑽取</div><button class="btn btn-primary" onclick="addChildNode('${node.id}')">+ 新增第一個子項目</button></div>`
  } else {
    content=`
      <div class="stats-row">
        <div class="stat-card"><div class="stat-lbl">子項目數</div><div class="stat-val">${node.children.length}</div></div>
        <div class="stat-card${over?' stat-err':under?' stat-warn':''}">
          <div class="stat-lbl">合計</div>
          <div class="stat-val">${fmt(tot)} ${esc(node.unit)}</div>
          ${over?`<div class="stat-note">⚠ 超過 100%</div>`:under?`<div class="stat-note">剩 ${(100-tot).toFixed(2)}% 未分配</div>`:''}
        </div>
      </div>
      <div class="detail-grid">
        <div class="card">
          <div class="card-lbl">佔比圓餅圖</div>
          <div class="card-hint">點擊扇形可向下鑽取</div>
          <canvas id="cv-pie" height="260"></canvas>
        </div>
        <div class="ch-table">
          <div class="ch-table-hdr"><span class="ch-table-lbl">組成項目</span><span class="text-muted" style="font-size:.75rem">${node.children.length} 項</span></div>
          <div class="ch-list">${node.children.map(c=>{
            const pct=tot>0?(c.value/tot*100).toFixed(1):0
            return `<div class="ch-row" onclick="go('#bom/${c.id}')">
              <div class="ch-dot" style="background:${c.color||'#6b7280'}"></div>
              <div class="ch-info">
                <div class="ch-name">${esc(c.name)}</div>
                ${c.description?`<div class="ch-subdesc">${esc(c.description)}</div>`:''}
                <div class="ch-bar"><div class="ch-bar-fill" style="width:${Math.min(pct,100)}%;background:${c.color||'#6b7280'}"></div></div>
              </div>
              <div class="ch-val">
                <div>${c.value} ${esc(c.unit)}</div>
                ${isP?`<div class="ch-pct">${pct}%</div>`:''}
                ${c.children.length?`<div class="ch-pct">${c.children.length} 子層</div>`:''}
              </div>
              <div class="ch-acts" onclick="event.stopPropagation()">
                <button class="ch-btn" onclick="editChildNode('${c.id}')">✏</button>
                <button class="ch-btn del" onclick="delChildNode('${c.id}')">✕</button>
              </div>
            </div>`
          }).join('')}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-lbl">長條圖</div>
        <div class="card-hint">點擊長條可向下鑽取</div>
        <canvas id="cv-bar" height="160"></canvas>
      </div>`
  }

  document.getElementById('app').innerHTML=`
    <div class="detail-hdr">
      <div class="detail-name-row">
        <div class="detail-bar" style="background:${node.color||'#6366f1'}"></div>
        <div><div class="detail-title">${esc(node.name)}</div>${node.description?`<div class="detail-desc-txt">${esc(node.description)}</div>`:''}</div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-ghost btn-sm" onclick="editNode('${node.id}')">✏ 編輯</button>
        <button class="btn btn-ghost btn-sm" onclick="showJson({mode:'both',node:findN(S.roots,'${node.id}'),onImport:items=>importChildren('${node.id}',items)})">⬡ JSON</button>
        <button class="btn btn-primary btn-sm" onclick="addChildNode('${node.id}')">+ 新增子項目</button>
      </div>
    </div>${content}`

  if(node.children.length) setTimeout(()=>{drawPie(node);drawBar(node)},0)
}

function addChildNode(pid) {
  const parent=findN(S.roots,pid)
  showEditor({title:'新增子項目',onSave:d=>{
    const child={...d,id:uid(),color:d.color||col(parent.children.length),children:[]}
    S.roots=addChild(S.roots,pid,child); save(); render()
  }})
}
function editNode(id) {
  const n=findN(S.roots,id)
  showEditor({title:'編輯節點',initial:n,onSave:d=>{S.roots=updateN(S.roots,{...n,...d});save();render()}})
}
function editChildNode(id) {
  const n=findN(S.roots,id)
  showEditor({title:`編輯：${n.name}`,initial:n,onSave:d=>{S.roots=updateN(S.roots,{...n,...d});save();render()}})
}
function delChildNode(id) {
  if(!confirm('確定要刪除此項目及所有子層？'))return
  S.roots=delN(S.roots,id); save(); render()
}
function importChildren(pid,items) {
  const arr=Array.isArray(items)?items:[items]
  arr.forEach((it,i)=>{
    const child={id:uid(),name:it.name||`項目 ${i+1}`,value:it.value??0,unit:it.unit||'%',description:it.description||undefined,color:it.color||col(i),children:it.children||[]}
    S.roots=addChild(S.roots,pid,child)
  })
  save(); render()
}

/* ════ MODAL ════════════════════════════════════════════ */
let _save=null
function openModal(html,wide=false){
  const m=document.getElementById('modal'); m.className='modal-box'+(wide?' modal-wide':''); m.innerHTML=html
  document.getElementById('overlay').classList.add('show')
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('modal').innerHTML=''; _save=null }
function onOverlayClick(e){ if(e.target.id==='overlay')closeModal() }

/* ── Editor ────────────────────────────────── */
const UNITS=['%','USD','NTD','pcs','kg','W','GB','TB']
function showEditor({title,initial={},onSave}) {
  _save=onSave
  const isC=initial.unit&&!UNITS.includes(initial.unit)
  const sc=initial.color||PALETTE[0]
  openModal(`<div class="modal-hdr"><span class="modal-title">${title}</span><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="fg"><label class="fl"><span class="req">必填</span> 名稱</label><input id="fn" class="fi" placeholder="例：晶片 (GPU)" value="${esc(initial.name||'')}" autofocus/></div>
    <div class="frow">
      <div class="fg"><label class="fl"><span class="req">必填</span> 數值</label><input id="fv" type="number" step="any" class="fi" value="${initial.value??''}"/></div>
      <div class="fg"><label class="fl">單位</label>
        <select id="fu" class="fs" onchange="toggleCU()">
          ${UNITS.map(u=>`<option${initial.unit===u||(!initial.unit&&u==='%')?' selected':''}>${u}</option>`).join('')}
          <option value="custom"${isC?' selected':''}>自訂…</option>
        </select>
      </div>
    </div>
    <div class="fg" id="fcw" style="${isC?'':'display:none'}"><label class="fl">自訂單位</label><input id="fcu" class="fi" placeholder="個、元…" value="${isC?esc(initial.unit):''}"/></div>
    <div class="fg"><label class="fl">說明</label><textarea id="fd" class="ft">${esc(initial.description||'')}</textarea></div>
    <div class="fg"><label class="fl">顏色</label>
      <div class="color-picker">${PALETTE.map(c=>`<div class="cswatch${c===sc?' active':''}" style="background:${c}" data-c="${c}" onclick="pickColor('${c}')"></div>`).join('')}</div>
      <input type="hidden" id="fc" value="${sc}"/>
    </div>
    <div class="f-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="subEditor()">儲存</button></div>
  </div>`)
}
function toggleCU(){document.getElementById('fcw').style.display=document.getElementById('fu').value==='custom'?'':'none'}
function pickColor(c){document.querySelectorAll('.cswatch').forEach(el=>el.classList.toggle('active',el.dataset.c===c));document.getElementById('fc').value=c}
function subEditor(){
  const name=document.getElementById('fn').value.trim()
  const value=parseFloat(document.getElementById('fv').value)
  const us=document.getElementById('fu').value
  const unit=us==='custom'?(document.getElementById('fcu').value.trim()||'%'):us
  const description=document.getElementById('fd').value.trim()||undefined
  const color=document.getElementById('fc').value
  if(!name||isNaN(value))return
  if(_save)_save({name,value,unit,description,color}); closeModal()
}

/* ── JSON Modal ────────────────────────────── */
function showJson({mode='both',node,onImport}){
  const hasE=mode==='export'||mode==='both', hasI=mode==='import'||mode==='both'
  const first=mode==='import'?'import':'export'
  window._jcb=onImport
  openModal(`<div class="modal-hdr">
    <div class="json-tabs" style="border:none;margin:0;padding:0">
      ${hasE?`<button class="jtab${first==='export'?' active':''}" id="jt-export" onclick="swJTab('export')">匯出 JSON</button>`:''}
      ${hasI?`<button class="jtab${first==='import'?' active':''}" id="jt-import" onclick="swJTab('import')">匯入 JSON</button>`:''}
    </div>
    <button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    ${hasE?`<div id="jp-export" style="${first!=='export'?'display:none':''}">
      <textarea class="json-ta" readonly>${JSON.stringify(node,null,2)}</textarea>
      <div style="margin-top:10px"><button class="btn btn-primary btn-sm" onclick="copyJ()">複製到剪貼簿</button><span id="cpmsg" style="font-size:.8rem;color:var(--green);display:none;margin-left:8px">✓ 已複製！</span></div>
    </div>`:''}
    ${hasI?`<div id="jp-import" style="${first!=='import'?'display:none':''}">
      <div class="json-hint"><strong>✦ 支援任意 JSON 結構</strong><br>標準 BOM 格式直接匯入；Gemini / ChatGPT 輸出自動開啟<strong>智慧轉換介面</strong>，可選擇欄位對應。</div>
      <textarea class="json-ta" id="jta" placeholder="貼上任意 JSON…"></textarea>
      <div id="jerr" class="err-msg" style="display:none"></div>
      <div style="margin-top:10px"><button class="btn btn-primary btn-sm" onclick="subJ()">分析並匯入</button></div>
    </div>`:''}
  </div>`,true)
}
function swJTab(t){['export','import'].forEach(x=>{const b=document.getElementById('jt-'+x);const p=document.getElementById('jp-'+x);if(b)b.classList.toggle('active',x===t);if(p)p.style.display=x===t?'':'none'})}
function copyJ(){const ta=document.querySelector('#jp-export .json-ta');if(!ta)return;navigator.clipboard.writeText(ta.value);const m=document.getElementById('cpmsg');m.style.display='inline';setTimeout(()=>m.style.display='none',2000)}
function subJ(){
  const text=document.getElementById('jta').value.trim(); const err=document.getElementById('jerr')
  let data; try{data=JSON.parse(text)}catch{err.textContent='⚠ 無效的 JSON 格式';err.style.display='block';return}
  err.style.display='none'
  const items=Array.isArray(data)?data:(data.children??[data])
  const std=items.length&&items.every(i=>typeof i.name==='string'&&typeof i.value==='number')
  if(std){closeModal();if(window._jcb)window._jcb(items)}
  else{closeModal();showSmart(data,window._jcb)}
}

/* ── Smart Import ──────────────────────────── */
function findArrs(obj,path=''){
  const r=[]
  if(Array.isArray(obj)&&obj.length&&typeof obj[0]==='object'&&obj[0]!==null) r.push({path:path||'root',label:`${path||'root'}  (${obj.length} 項)`,items:obj})
  if(!Array.isArray(obj)&&typeof obj==='object'&&obj!==null) for(const k of Object.keys(obj)) r.push(...findArrs(obj[k],path?`${path}.${k}`:k))
  return r
}
function getPK(items){const ks=new Set();for(const it of items.slice(0,5))if(typeof it==='object'&&it)for(const[k,v]of Object.entries(it))if(typeof v==='string'||typeof v==='number')ks.add(k);return[...ks]}
function autoD(keys,role){const p={name:/name|title|label|品名|名稱|_zh$/i,value:/share|percent|ratio|value|佔比|比例|營收|cost|price|amount|revenue/i,desc:/desc|note|comment|detail|highlight|備註|說明|_zh$/i};return keys.find(k=>p[role].test(k))||keys[0]||''}
function detUnit(items,f){for(const it of items.slice(0,3)){const v=String(it[f]||'');if(v.includes('%'))return'%';if(/\$|USD/i.test(v))return'USD';if(/NTD|NT\$|元/.test(v))return'NTD'}return'%'}

let _ss={}
function showSmart(raw,cb){
  const paths=findArrs(raw)
  if(!paths.length){alert('此 JSON 中找不到物件陣列，無法自動轉換。');return}
  const init=paths[0]; const keys=getPK(init.items)
  _ss={paths,raw,cb,sel:init.path,nf:autoD(keys,'name'),vf:autoD(keys,'value'),df:autoD(keys,'desc'),unit:detUnit(init.items,autoD(keys,'value'))}
  drawSmart()
}
function drawSmart(){
  const{paths,sel,nf,vf,df,unit}=_ss
  const arr=paths.find(p=>p.path===sel)?.items||[]; const keys=getPK(arr)
  const prev=arr.slice(0,5).map((it,i)=>({name:String(it[nf]||`項目 ${i+1}`),val:parseNum(it[vf]),desc:df?String(it[df]||''):'',col:col(i)}))
  openModal(`<div class="modal-hdr">
    <div><span style="font-size:.7rem;background:rgba(99,102,241,.2);color:#a5b4fc;padding:2px 8px;border-radius:20px;font-weight:700">智慧匯入</span><span class="modal-title" style="margin-left:8px">欄位對應設定</span></div>
    <button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="fg"><div class="step-lbl">① 選擇資料來源陣列</div>
      <select class="fs" onchange="smartArr(this.value)">${paths.map(p=>`<option value="${p.path}"${p.path===sel?' selected':''}>${esc(p.label)}</option>`).join('')}</select>
    </div>
    <div class="fg"><div class="step-lbl">② 欄位對應</div>
      <div class="field-grid">
        <div class="fcell"><div class="fcell-lbl"><span class="req">必填</span>名稱欄位</div>
          <select class="fs" style="font-size:.82rem" onchange="smartSet('nf',this.value)">${keys.map(k=>`<option${k===nf?' selected':''}>${k}</option>`).join('')}</select>
          ${nf&&arr[0]?`<div class="fprev">例：${esc(String(arr[0][nf]||''))}</div>`:''}
        </div>
        <div class="fcell"><div class="fcell-lbl"><span class="req">必填</span>數值欄位</div>
          <div style="display:flex;gap:6px">
            <select class="fs" style="font-size:.82rem;flex:1" onchange="smartSet('vf',this.value)">${keys.map(k=>`<option${k===vf?' selected':''}>${k}</option>`).join('')}</select>
            <select class="fs" style="font-size:.82rem;width:62px" onchange="smartSet('unit',this.value)">${['%','USD','NTD','pcs','kg'].map(u=>`<option${u===unit?' selected':''}>${u}</option>`).join('')}</select>
          </div>
          ${vf&&arr[0]?`<div class="fprev">例：${esc(String(arr[0][vf]||''))} <span class="arr">→</span> <span style="color:#818cf8">${parseNum(arr[0][vf])} ${unit}</span></div>`:''}
        </div>
        <div class="fcell span2"><div class="fcell-lbl">說明欄位（選填）</div>
          <select class="fs" style="font-size:.82rem" onchange="smartSet('df',this.value)">
            <option value="">— 不使用 —</option>
            ${keys.map(k=>`<option${k===df?' selected':''}>${k}</option>`).join('')}
          </select>
          ${df&&arr[0]?`<div class="fprev">例：${esc(String(arr[0][df]||'').slice(0,60))}</div>`:''}
        </div>
      </div>
    </div>
    <div class="fg"><div class="step-lbl">③ 轉換預覽（前 ${prev.length} 項，共 ${arr.length} 項）</div>
      <div class="smart-preview">
        ${prev.map(r=>`<div class="sp-row">
          <div style="width:10px;height:10px;border-radius:50%;background:${r.col};flex-shrink:0"></div>
          <div style="flex:1;min-width:0"><div style="font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div>${r.desc?`<div style="font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">${esc(r.desc)}</div>`:''}</div>
          <span style="color:#818cf8;font-weight:700;font-size:.85rem;flex-shrink:0">${r.val} ${esc(unit)}</span>
        </div>`).join('')}
        ${arr.length>5?`<div class="sp-more">… 還有 ${arr.length-5} 項</div>`:''}
      </div>
    </div>
    <div class="f-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="subSmart()">匯入 ${arr.length} 個項目</button></div>
  </div>`,true)
}
function smartArr(path){_ss.sel=path;const arr=_ss.paths.find(p=>p.path===path)?.items||[];const k=getPK(arr);_ss.nf=autoD(k,'name');_ss.vf=autoD(k,'value');_ss.df=autoD(k,'desc');_ss.unit=detUnit(arr,_ss.vf);drawSmart()}
function smartSet(f,v){_ss[f]=v;drawSmart()}
function subSmart(){
  const{paths,sel,nf,vf,df,unit,cb}=_ss; const arr=paths.find(p=>p.path===sel)?.items||[]
  const items=arr.map((it,i)=>({name:String(it[nf]||`項目 ${i+1}`),value:parseNum(it[vf]),unit,description:df?(String(it[df]||'')||undefined):undefined,color:col(i),children:[]}))
  closeModal(); if(cb)cb(items)
}

/* ════ INIT ═════════════════════════════════════════════ */
load(); render(); window.addEventListener('hashchange',render)
</script>
</body>
