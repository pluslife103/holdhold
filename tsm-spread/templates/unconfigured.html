<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>網站未設定</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05070f;
      --surface: #0e1425;
      --border: #1e2d50;
      --text: #e2e8f0;
      --muted: #7a8ba8;
      --gold: #f59e0b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 0.92rem; line-height: 1.7; }
    .msg {
      margin-top: 16px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fcd34d;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>網站已關閉</h1>
    <p>登入所需的環境變數還沒設定，因此所有頁面與 API 都拒絕存取。</p>
    <div class="msg">{{ message }}</div>
  </div>
</body>
</html>
